[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/telegram",
    "crates/downloader",
    "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
tgbooks-core = { path = "crates/core" }
tgbooks-downloader = { path = "crates/downloader" }
tgbooks-storage = { path = "crates/storage" }
tgbooks-telegram = { path = "crates/telegram" }

anyhow = "=1.0.104"
async-channel = "=2.5.0"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
directories = "=6.0.0"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
grammers-client = { version = "=0.11.0", default-features = false }
grammers-session = { version = "=0.11.0", default-features = false, features = ["serde"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi", "registry"] }
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.1"

# Keep both packages on the same reviewed Zed revision. Never replace rev with branch.
gpui = { git = "https://github.com/zed-industries/zed", rev = "504abf602a09edc3c7d5a4f4f60958aee335274f", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "504abf602a09edc3c7d5a4f4f60958aee335274f", default-features = false, features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 1

[profile.test]
debug = 1
