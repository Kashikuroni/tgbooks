# LICENSE / NOTICE, shipped separately. Include transitive and build dependencies.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
